apiVersion: v1
kind: Namespace
metadata:
  name: data-philter
---
# ConfigMaps are generated by Kustomize in k8s/kustomization.yaml
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: philter-data
  namespace: data-philter
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: druid-mcp-server
  namespace: data-philter
  labels:
    app: druid-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: druid-mcp-server
  template:
    metadata:
      labels:
        app: druid-mcp-server
    spec:
      containers:
        - name: druid-mcp-server
          image: iunera/druid-mcp-server:latest
          imagePullPolicy: Always
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "http"
            - name: SERVER_PORT
              value: "8080"
          envFrom:
            - configMapRef:
                name: druid-env
---
# Service for Druid MCP Server (ClusterIP). If the app connects via service discovery, this exposes it within the cluster.
apiVersion: v1
kind: Service
metadata:
  name: druid-mcp-server
  namespace: data-philter
spec:
  selector:
    app: druid-mcp-server
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: philter
  namespace: data-philter
  labels:
    app: philter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: philter
  template:
    metadata:
      labels:
        app: philter
    spec:
      containers:
        - name: philter
          image: iunera/philter:latest
          imagePullPolicy: Always
          env:
            - name: SPRING_PROFILES_ACTIVE
              # append 'clickhouse for clickhouse support
              value: "docker,druid"
            - name: SERVER_PORT
              value: "4000"
          envFrom:
            - configMapRef:
                name: philter-app-env
          ports:
            - containerPort: 4000
              name: http
          volumeMounts:
            - name: philter-data
              mountPath: /data
      volumes:
        - name: philter-data
          persistentVolumeClaim:
            claimName: philter-data
---
apiVersion: v1
kind: Service
metadata:
  name: philter
  namespace: data-philter
spec:
  type: NodePort
  selector:
    app: philter
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      nodePort: 30400
